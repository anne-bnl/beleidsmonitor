# Gebieden voor de grondwaterindicator (Rijksdriehoekscoördinaten, middelpunt).
# Rond elk punt wordt een vierkant van 6 bij 6 km doorzocht op ondiepe BRO-peilbuizen.
# type: hoog = hoge zandgronden (vrij afwaterend), laag = laag Nederland (peilbeheerst)

max_filterdiepte_m: 5        # alleen filters tot 5 m onder maaiveld (ondiep grondwater)
min_zomers: 15               # een buis telt mee bij minstens 15 gemeten zomers
max_buizen_per_gebied: 25
halve_breedte_m: 3000

