# Bronnenlijst van de beleidsmonitor.
#
# Per bron:
#   naam       : zoals hij op het dashboard verschijnt
#   categorie  : groep op het dashboard
#   methode    : api_tk_documenten | api_tk_besluiten | api_koop | api_rechtspraak | feed | web | zoekcontrole
#                - api_*  : officiële koppeling, vraagt alle nieuwe en gewijzigde stukken op
#                - feed   : RSS/Atom-feed van de bron
#                - web    : webpagina; het programma zoekt eerst zelf naar een feed,
#                           en vergelijkt anders de links op de pagina met de vorige keer
#                - web probeert als laatste stap ook een onzichtbare browser (voor pagina's die
#                  pas in de browser worden opgebouwd)
#                - gedekt : de inhoud komt al volledig binnen via een andere bron
#                - zoekcontrole : website staat automatisch uitlezen niet toe; Claude controleert
#                           deze bron dagelijks met een gerichte zoekopdracht (minder volledig)
#   url        : adres
#   filter     : alles (alles gaat door naar beoordeling) | trefwoord (alleen bij treffer)
#   toegevoegd : eigen = uit de lijst van Anne, voorstel = door Claude voorgesteld en goedgekeurd

bronnen:

  # ---------- Parlement en Rijk: officiële koppelingen ----------
