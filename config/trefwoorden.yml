# Trefwoorden voor de voorselectie.
#
# Deze lijst wordt ALLEEN gebruikt bij bronnen met grote aantallen publicaties
# (algemeen nieuws, gemeente-, provincie- en waterschapsbladen, Staatscourant,
# rechtspraak). Bij die bronnen gaat een publicatie door naar de inhoudelijke
# beoordeling als minstens één trefwoord voorkomt in titel, samenvatting of
# (waar beschikbaar) de volledige tekst. Bij alle andere bronnen gaat ALLES door.
#
# De lijst is bewust ruim. Liever een paar berichten te veel dan een gemist stuk.
# Schrijfwijze: kleine letters = hoofdletterongevoelig, en het woord mag langer
# doorlopen ("stikstof" vindt ook "stikstofdepositie"). Afkortingen in HOOFDLETTERS
# worden alleen als los woord gevonden. Een term die begint met = wordt
# precies zo gezocht, inclusief hoofdletters ("=dassen" vindt niet het Kamerlid Dassen).

