# Bronnen voor de indicatoren op de voorpagina van het dashboard.
# Deze worden één keer per maand opgehaald (de rest van de monitor draait dagelijks).
#
# cbs_tabellen : open-datatabellen van CBS StatLine (tabelnummer en omschrijving)
# cbs_zoeken   : zoekwoorden om in de CBS-catalogus naar (nieuwere) tabellen te zoeken
# knmi_station : KNMI-station voor de klimaatreeks (260 = De Bilt)

dagen_tussen_updates: 28

# De CBS-tabellen voor dagvlinders (37212) en vleermuizen (37701) lopen maar tot 2005-2006;
# die cijfers komen daarom uit de publicaties van CBS en de Zoogdiervereniging.
cbs_tabellen:
  - {id: "84498NED", naam: Broedvogels}
  - {id: "83671NED", naam: Bouwvergunningen woonruimten, alleen_nederland: true}

cbs_zoeken: ["Living Planet", "Vlinders", "Vleermuizen", "broedvogels", "Bouwvergunningen woonruimten"]

# Cijfertabellen achter grafieken van het Compendium voor de Leefomgeving (PBL)
pbl_infographics:
  - {id: "1578_001g_clo_06_nl", naam: Zoetwatervissen}
  - {id: "1584_001g_clo_04_nl", naam: Zeevissen}

knmi_station: 260
